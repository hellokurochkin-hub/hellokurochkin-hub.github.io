<!doctype html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f5f5f5">
  <meta name="description" content="Интерактивный прототип нового градусника доставки Лавки по макетам Figma.">
  <title>Лавка · Прогресс доставки</title>
  <link rel="preload" href="assets/fonts/ys-text-regular.ttf" as="font" type="font/ttf" crossorigin>
  <link rel="preload" href="assets/fonts/ys-text-medium.ttf" as="font" type="font/ttf" crossorigin>
  <link rel="stylesheet" href="tokens.css">
  <link rel="stylesheet" href="styles.css">
  <script type="module" src="app.js"></script>
</head>
<body>
  <main class="workspace">
    <div class="device-space">
      <div class="device" aria-label="Прототип футера Лавки">
        <div class="viewport">
          <div class="status-bar" aria-hidden="true"><img class="status-time" src="assets/time.svg" width="138" height="54" alt=""><span class="dynamic-island"></span><img class="status-levels" src="assets/status.svg" width="143" height="54" alt=""></div>
          <div class="screen-placeholder" aria-hidden="true" data-node-id="14100:112194"></div>
        <div class="dock">
          <div class="delivery" data-node-id="14064:107879" aria-label="Прогресс до бесплатной доставки">
            <div class="delivery-bar" data-node-id="14064:107881" data-phase="paid" aria-hidden="true">
              <span class="courier"><img src="assets/courier.svg" alt="" width="14" height="14"></span>
              <div class="paid-content">
                <div class="first-leg"><span class="price">149<span>₽</span></span><span class="track"><span class="fill first-fill"></span></span></div>
                <span class="price next-price">99<span>₽</span></span><span class="track last-track"><span class="fill last-fill"></span></span><span class="price end-price">0<span>₽</span></span>
              </div>
              <span class="free-label">Бесплатная доставка</span>
            </div>
            <p class="delivery-caption">Ещё 500 ₽ и доставка дешевле</p>
            <span class="sr-only" id="delivery-progress" role="progressbar" aria-valuemin="0" aria-valuemax="1000" aria-valuenow="0" aria-label="Сумма заказа для бесплатной доставки"></span>
          </div>
          <nav class="shop-nav" aria-hidden="true">
            <span class="nav-icon active"><img src="assets/shop.svg" width="24" height="24" alt=""></span>
            <span class="favorite-static" aria-hidden="true"><img src="assets/heart.svg" width="24" height="24" alt=""></span>
            <span class="nav-icon basket-icon"><img src="assets/basket.svg" width="24" height="24" alt=""><span class="basket-count" hidden>0</span></span>
          </nav>
          <div class="home-indicator" aria-hidden="true"><span></span></div>
        </div>
        </div>
      </div>
    </div>
    <aside class="controls" aria-label="Управление анимацией">
      <p class="eyebrow">ЛАВКА · ПРОТОТИП</p>
      <h1>Прогресс доставки</h1>
      <div class="live-summary"><div><label for="basket-amount">Сумма корзины</label><strong id="summary-sum">0 ₽</strong></div><div><span>Доставка</span><strong id="summary-delivery">149 ₽</strong></div></div>
      <input id="basket-amount" type="range" min="0" max="2000" step="100" value="0" aria-label="Сумма корзины">
      <div class="amount-controls"><button id="remove">− 100 ₽</button><button id="add">+ 100 ₽</button></div>
      <button class="demo-button" id="demo">Показать анимацию</button>
      <button class="reset-button" id="reset">Начать заново</button>
      <p class="demo-note">99 ₽ за доставку от 500 ₽.<br>Бесплатно от 1 000 ₽.</p>
      <p class="activity" id="activity" role="status" aria-live="polite">Меняйте сумму корзины или запустите анимацию.</p>
    </aside>
  </main>
</body>
</html>
